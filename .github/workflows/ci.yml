name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt, clippy and layering
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux packages
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Layering check
        run: cargo xtask layers

  test:
    name: build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - name: Lock file is up to date
        run: git diff --exit-code -- Cargo.lock

  macos-universal:
    name: macOS universal binary
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build both architectures
        run: cargo build --release --locked -p serviceflow --target aarch64-apple-darwin --target x86_64-apple-darwin
      - name: Combine with lipo
        run: |
          mkdir -p out
          lipo -create -output out/serviceflow \
            target/aarch64-apple-darwin/release/serviceflow \
            target/x86_64-apple-darwin/release/serviceflow
          lipo -info out/serviceflow
          lipo -verify_arch out/serviceflow x86_64 arm64
      - name: Package unsigned zip
        run: ditto -c -k out/serviceflow serviceflow-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: serviceflow-macos-universal
          path: serviceflow-macos-universal.zip

  wasm:
    name: wasm build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo check for wasm32
        run: cargo xtask wasm
      - uses: ./.github/actions/install-trunk
      - name: trunk build
        working-directory: app
        run: trunk build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: serviceflow-web
          path: dist/web
