name: Install trunk
description: Install a pinned trunk release binary (Linux x86_64) onto the PATH.
inputs:
  version:
    description: trunk version
    default: "0.22.1"
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        mkdir -p "$HOME/.local/bin"
        curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/v${{ inputs.version }}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
          | tar -xz -C "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/trunk" --version
