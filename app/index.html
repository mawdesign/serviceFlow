<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>serviceFlow</title>
    <link data-trunk rel="rust" data-bin="serviceflow" data-wasm-opt="z" data-weak-refs />
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1b1b1b; }
        #serviceflow_canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #serviceflow_loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #ccc; font: 16px system-ui, sans-serif; }
    </style>
</head>
<body>
    <canvas id="serviceflow_canvas"></canvas>
    <div id="serviceflow_loading">Loading serviceFlow…</div>
</body>
</html>
