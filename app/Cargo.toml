[package]
name = "serviceflow"
description = "serviceFlow: media and worship presentation. The egui shell for desktop and the browser."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serviceflow-core = { workspace = true }
serviceflow-storage = { workspace = true }
serviceflow-storage-memory = { workspace = true }
serviceflow-runtime = { workspace = true }
serviceflow-render = { workspace = true }
egui = { workspace = true }
craft-window = { workspace = true }
craft-ui = { workspace = true }
craft-i18n = { workspace = true }
craft-keymap = { workspace = true, features = ["ui"] }
serde_json = { workspace = true }
serde = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
serviceflow-storage-fs = { workspace = true }
craft-dialogs = { workspace = true }
craft-font-catalog = { workspace = true }
craft-settings = { workspace = true }
eframe = { workspace = true, features = ["x11", "wayland"] }
winit = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { workspace = true }
log = "0.4"
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlCanvasElement"] }

[dev-dependencies]
egui_kittest = { workspace = true }
serviceflow-testkit = { workspace = true }
